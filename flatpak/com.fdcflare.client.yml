app-id: com.fdcflare.client
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20
  - org.freedesktop.Sdk.Extension.rust-stable
command: idcflare
separate-locales: false
build-options:
  append-path: /usr/lib/sdk/llvm20/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=system-bus
  - --device=dri
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=xdg-download:rw
  - --filesystem=xdg-documents:rw
modules:
  - name: wpe-layer
    buildsystem: simple
    build-commands:
      - |
        set -eu
        for dir in bin include lib libexec share; do
          if [ -e "${dir}" ]; then
            cp -a "${dir}" /app/
          fi
        done
    sources:
      - type: archive
        path: stage/wpe-layer/fluxidc-flatpak-wpe-layer-gnome48-x86_64.tar.zst

  - name: idcflare
    buildsystem: simple
    build-commands:
      - install -d /app/bin /app/idcflare /app/share/applications /app/share/icons/hicolor/512x512/apps /app/share/metainfo
      - bash source-tree/scripts/ci/flatpak/build_app.sh "$(pwd)/source-tree" /app/idcflare
      - install -Dm755 source-tree/flatpak/fluxidc-wrapper.sh /app/bin/idcflare
      - install -Dm644 source-tree/flatpak/com.fdcflare.client.desktop /app/share/applications/com.fdcflare.client.desktop
      - install -Dm644 source-tree/flatpak/com.fdcflare.client.metainfo.xml /app/share/metainfo/com.fdcflare.client.metainfo.xml
      - install -Dm644 source-tree/flatpak/icons/com.fdcflare.client.png /app/share/icons/hicolor/512x512/apps/com.fdcflare.client.png
      # 媒体压缩:静态 ffmpeg 进 /app/bin(PATH),app 运行时按 PATH 查找。
      # 沙箱构建阶段禁网,CMake 的构建期下载会跳过(WARNING),CLI 由
      # 本 source 在源准备阶段(允许联网+sha256 校验)提供。
      - install -Dm755 ffmpeg-linux-x64 /app/bin/ffmpeg
      - rm -rf /app/include /app/lib/pkgconfig /app/share/pkgconfig /app/share/aclocal
      - rm -f /app/bin/unifdef /app/bin/woff2_compress /app/bin/woff2_decompress
    sources:
      - type: dir
        path: stage/source-tree
        dest: source-tree
      - type: file
        url: https://npmmirror.com/mirrors/ffmpeg-static/b6.0/ffmpeg-linux-x64
        sha256: ed652b2f32e0851d1946894fb8333f5b677c1b2ce6b9d187910a67f8b99da028
        dest-filename: ffmpeg-linux-x64
