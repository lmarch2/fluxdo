name: Build Android APK

run-name: Build FluxIDC Android arm64 APK from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing release tag to receive the APK
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_NDK_VERSION: '27.3.13750724'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android/sdk/ndk \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/share/chromium
          sudo docker image prune --all --force > /dev/null 2>&1 || true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/doh_proxy
          key: android-arm64-release

      - name: Setup Android build environment
        run: |
          cargo install cargo-ndk
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;${{ env.ANDROID_NDK_VERSION }}'

      - name: Configure Android NDK path
        run: |
          ndk_path="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          test -d "${ndk_path}"
          echo "ANDROID_NDK_HOME=${ndk_path}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ndk_path}" >> "${GITHUB_ENV}"

      - name: Setup Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ] && [ -n "${ANDROID_KEY_PROPERTIES}" ]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/app/upload-keystore.jks
            echo "${ANDROID_KEY_PROPERTIES}" > android/key.properties
          else
            echo "Android signing secrets are not configured; using debug signing."
          fi
          if [ -n "${GOOGLE_SERVICES_JSON}" ]; then
            echo "${GOOGLE_SERVICES_JSON}" | base64 -d > android/app/google-services.json
          else
            echo "Using the checked-in dummy Firebase configuration."
          fi

      - name: Build arm64 APK
        id: package
        run: |
          dart tool/flutterw.dart build apk --release \
            --target-platform android-arm64 \
            --dart-define=cronetHttpNoPlay=true \
            --split-debug-info=build/symbols

          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -f "${apk}"
          unzip -l "${apk}" | grep "lib/arm64-v8a/libdoh_proxy.so"
          if unzip -Z1 "${apk}" | grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "Unexpected non-arm64 native library found in APK." >&2
            exit 1
          fi
          test "$("${ANDROID_HOME}/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "${apk}")" = "com.fdcflare.client"

          apksigner="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "${apksigner}"
          "${apksigner}" verify --verbose --print-certs "${apk}"

          version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          build_number="$(sed -n 's/^version: [^+]*+\(.*\)/\1/p' pubspec.yaml)"
          test "$("${ANDROID_HOME}/cmdline-tools/latest/bin/apkanalyzer" manifest version-name "${apk}")" = "${version}"
          test "$("${ANDROID_HOME}/cmdline-tools/latest/bin/apkanalyzer" manifest version-code "${apk}")" = "${build_number}"

          apk_name="FluxIDC-${version}-arm64-v8a.apk"
          mkdir -p dist
          mv "${apk}" "dist/${apk_name}"
          (
            cd dist
            sha256sum "${apk_name}" > "${apk_name}.sha256"
          )
          echo "apk_name=${apk_name}" >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluxIDC-Android-arm64
          path: |
            dist/${{ steps.package.outputs.apk_name }}
            dist/${{ steps.package.outputs.apk_name }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            dist/${{ steps.package.outputs.apk_name }}
            dist/${{ steps.package.outputs.apk_name }}.sha256
          fail_on_unmatched_files: true
          overwrite_files: true
